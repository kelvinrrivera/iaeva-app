name: Cron — Downgrade Expired Grace Period Shops

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  trigger:
    name: Downgrade past_due shops whose grace period expired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call downgrade grace expired endpoint
        run: |
          curl -sf -X GET "$APP_URL/api/cron/downgrade-grace-expired" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || echo "Request failed"
