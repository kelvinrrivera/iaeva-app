name: Cron — Refresh Meta Tokens

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  trigger:
    name: Refresh Meta WhatsApp tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call meta token refresh endpoint
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/refresh-meta-tokens" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}" || echo "Request failed"
