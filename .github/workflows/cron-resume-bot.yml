name: Cron — Resume Bot Control

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    name: Resume bot control after takeover TTL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call resume bot endpoint
        run: |
          curl -sf -X GET "$APP_URL/api/cron/resume-bot" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || echo "Request failed"
